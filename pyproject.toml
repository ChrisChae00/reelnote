[project]
name = "reelnote"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0",
  "trafilatura>=1.12",
  "pypdf>=5.0",
  "ocrmac>=1.0",
  "numpy>=1.26",
  "scikit-learn>=1.5",
]

[project.scripts]
reelnote = "reelnote.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reelnote"]

[tool.pytest.ini_options]
testpaths = ["tests"]
